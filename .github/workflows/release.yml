name: Release

# A pushed tag v* builds the binary for every supported platform, writes
# SHA256SUMS, attests build provenance and publishes the GitHub release.
# The matrix-skill downloads these assets by tag and checks them against
# SHA256SUMS, so asset names are part of its interface: do not rename them.

on:
  push:
    tags: ['v*']

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-15,         target: aarch64-apple-darwin }
          - { os: macos-15,         target: x86_64-apple-darwin }
          - { os: windows-2025,     target: x86_64-pc-windows-msvc,     ext: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            export CC="musl-gcc"
          fi
          cargo build --locked --release --target "$TARGET"
      - name: Stage asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/matrix-e2ee-cli$EXT" "dist/matrix-e2ee-cli-$TARGET$EXT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-e2ee-cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum matrix-e2ee-cli-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/matrix-e2ee-cli-*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
