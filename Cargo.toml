[package]
name = "matrix-e2ee-cli"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "End-to-end encrypted Matrix messaging from the command line, built on matrix-sdk"
repository = "https://github.com/netresearch/matrix-e2ee-cli"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# Lookaround in the patterns of the matrix-skill's Markdown renderer
# (formatting.rs), which the regex crate does not support.
fancy-regex = "0.20"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# tcflush (discard typed-ahead input before the emoji confirmation).
libc = "0.2"
matrix-sdk = { version = "=0.20.0", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
    "rustls-aws-lc-rs",
] }
# CollectStrategy (the room-key recipient strategy) is not re-exported by matrix-sdk.
matrix-sdk-base = { version = "=0.20.0", default-features = false, features = ["e2e-encryption"] }
rand = "0.9"
rpassword = "7"
# Reads the matrix-nio store read-only. The same rusqlite matrix-sdk-sqlite
# links (one libsqlite3 per binary), bundled through matrix-sdk's feature.
rusqlite = { version = "0.41", default-features = false }
serde = { version = "1", features = ["derive"] }
# raw_value: read.rs keeps content.info as received (its key order).
serde_json = { version = "1", features = ["raw_value"] }
# The hash in a room's file names (roomlog.rs).
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "net", "signal", "sync"] }

[target.'cfg(windows)'.dependencies]
# FlushConsoleInputBuffer (discard typed-ahead input before the emoji confirmation).
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
